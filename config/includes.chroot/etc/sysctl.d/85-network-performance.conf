# Network & bufferbloat tunings
# Fair Queueing packet scheduler
net.core.default_qdisc = fq

# Google BBR congestion control for high throughput and low latency on Wi-Fi/congested links
net.ipv4.tcp_congestion_control = bbr

# TCP Fast Open for faster connection handshakes
net.ipv4.tcp_fastopen = 3

# Path MTU discovery probing to prevent black-hole drops
net.ipv4.tcp_mtu_probing = 1
