# Low-level system tunings
# Increase virtual memory map limit
vm.max_map_count = 2147483642

# Eliminate micro-stuttering
kernel.split_lock_mitigate = 0

# Optimize filesystem writeback responsiveness under heavy I/O (e.g. high-speed Steam downloads)
# Fixed byte limits prevent multi-gigabyte queue stalls on systems with large RAM
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.dirty_writeback_centisecs = 150
vm.dirty_expire_centisecs = 1500
